# First campaign file: E0 at Hier-30 and Hier-90, and E1′ at Hier-90 (plan §4.2).
#
#   python3.11 campaign.py campaigns/e0-e1-hier30-hier90.yml --python python3.11 --dry-run
#   tmux new -s e0e1 'python3.11 campaign.py campaigns/e0-e1-hier30-hier90.yml --python python3.11'
#
# Run it under tmux/nohup on the database node: a SIGKILLed driver leaves its agents up until the
# next invocation reaps them. Resumes from <out>/campaign_state.json; --only <cell> picks cells.
#
# Cells (5 repeats each, 95 runs):
#   E0   Hier-30  PBFT × analytic, G=1           — E0's alone (the eScience 5 × 5 topology)
#   E0 = E1′ Hier-90 PBFT × analytic, G=1        — doubles as E1′'s PBFT × analytic column; never rerun
#   E1′  Hier-90  {Snow, Hybrid} × analytic, G=1
#   E1′  Hier-90  {PBFT, Snow, Hybrid} × LinUCB {shared, per-group}, G=3
#   …and every Hier-90 E1′ cell again at a steady load (`-poisson3`, 9 cells), see below
#
# Arrivals (decided 2026-10-14): the cells above release 20 jobs/s (`--arrival batch`), about 5×
# what a Hier-90 fleet drains (~4.2 jobs/s), so each run is a backlog draining and queueing hides
# the decision time. Kept as the saturation point (and E0 must match eScience, which used it).
# The `-poisson3` cells repeat each Hier-90 E1′ cell at Poisson arrivals of 3 jobs/s (~70% of
# that drain rate), seeded by --seed so every repeat sees the same arrival times. Compare engines
# and bandit designs within one load level.
#
# Fan-out (decided 2026-10-08): analytic cells pass G=1 (§3.4, and E0 must be the eScience
# topology); bandit cells pass G=3, the E2 topology (3 coordinators × 3 groups), because at G=1 a
# bandit has one candidate and every delegation records `trivial`. The two columns therefore differ
# in topology as well as decision plane — say so beside any analytic-vs-bandit comparison, and
# compare engines within a column. No failure profile is injected: E1′ measures what the decision
# plane costs the consensus tier, not routing quality (that is E2).
#
# Not here: the E1′ mixed Hier-90 rung (needs T-6, not built), Hier-270 and Mesh-180 (their own file).
#
# Base configs, one per arm, each config_swarm_multi.yml with only the arm's keys changed — keep
# them unchanged for the whole campaign (run_meta.json records each run's base_config sha256):
#   PBFT config_pbft.yml · Snow ../config_swarm_multi.yml · Hybrid config_hybrid.yml
#   LinUCB (mab.enabled: true, algorithm linucb): config_{pbft,snow,hybrid}_linucb_{shared,pergroup}.yml
#     — the pair differs ONLY in mab.linucb.model (shared | disjoint); both keep load_slack 9 and
#     shaped reward, so the pair isolates the model design (decided 2026-10-13)
# All keep coordinator_cost_matrix: self (§3.5) — check proposers_per_job_l1 ≥ C/2 per cell.
#
# Workload: replay-golden duplicated per rung with duplicate_jobs.py into /root/workloads/jobs_<N>.
# Sizing: pilots took 11-18 min at Hier-30 and 30 min at Hier-270; the caps leave room for the
# 120 s execution cap on top of a slow schedule. Check fleet reachability (90 of 92 needed) and
# regenerate agent_hosts.txt with make_agent_hosts.py --count 90 (interleaved) before starting.
out: runs/campaign-e0-e1-fc9eb220     # the 9177551a campaign (runs/campaign-e0-e1-hier30-90) is not citable for Snow/Hybrid/LinUCB

defaults:
  runner: run_test.py
  repeats: 5
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20            # per-run RTT matrix (T-2), for E3a
    all-dtns: true             # every agent holds all 10 DTN names; capacities unchanged
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    # 600 s by default. PBFT+LinUCB concentrates work (pilot e669e79c: 64% of jobs to one child
    # group, a 4-core leaf holding 49 unstarted) and stopped TRUNCATED with 116 in flight; the
    # longer wait lets every job finish so its queueing is measured, not cut off. Fits every
    # cell's timeout_s (runtime cap + 1800 + setup/collection).
    inflight-drain-max-s: 1800

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  # ---- E0 ------------------------------------------------------------------------------------
  - name: e0-hier30-pbft-analytic
    timeout_s: 5400
    args: {agents: 30, jobs: 600, pegasus-jobs-dir: /root/workloads/jobs_600, runtime: 2400,
           groups-per-coordinator: 1, base-config: campaigns/config_pbft.yml}

  - name: e0-hier90-pbft-analytic          # = E1′ Hier-90 PBFT × analytic
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: campaigns/config_pbft.yml}

  # ---- E1′ Hier-90, analytic column (G=1) -----------------------------------------------------
  - name: e1-hier90-snow-analytic
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: config_swarm_multi.yml}

  - name: e1-hier90-hybrid-analytic
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: campaigns/config_hybrid.yml}

  # ---- E1′ Hier-90, bandit column (LinUCB, G=3): two model designs per engine ---------------
  - name: e1-hier90-pbft-linucb-shared
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_pbft_linucb_shared.yml}

  - name: e1-hier90-pbft-linucb-pergroup
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_pbft_linucb_pergroup.yml}

  - name: e1-hier90-snow-linucb-shared
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_snow_linucb_shared.yml}

  - name: e1-hier90-snow-linucb-pergroup
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_snow_linucb_pergroup.yml}

  - name: e1-hier90-hybrid-linucb-shared
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_hybrid_linucb_shared.yml}

  - name: e1-hier90-hybrid-linucb-pergroup
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_hybrid_linucb_pergroup.yml}

  # ---- the same Hier-90 E1′ cells at steady Poisson arrivals, 3 jobs/s ----------------------

  - name: e0-hier90-pbft-analytic-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: campaigns/config_pbft.yml,
           arrival: poisson, arrival-rate: 3.0}

  - name: e1-hier90-snow-analytic-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: config_swarm_multi.yml,
           arrival: poisson, arrival-rate: 3.0}

  - name: e1-hier90-hybrid-analytic-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: campaigns/config_hybrid.yml,
           arrival: poisson, arrival-rate: 3.0}

  - name: e1-hier90-pbft-linucb-shared-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_pbft_linucb_shared.yml,
           arrival: poisson, arrival-rate: 3.0}

  - name: e1-hier90-pbft-linucb-pergroup-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_pbft_linucb_pergroup.yml,
           arrival: poisson, arrival-rate: 3.0}

  - name: e1-hier90-snow-linucb-shared-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_snow_linucb_shared.yml,
           arrival: poisson, arrival-rate: 3.0}

  - name: e1-hier90-snow-linucb-pergroup-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_snow_linucb_pergroup.yml,
           arrival: poisson, arrival-rate: 3.0}

  - name: e1-hier90-hybrid-linucb-shared-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_hybrid_linucb_shared.yml,
           arrival: poisson, arrival-rate: 3.0}

  - name: e1-hier90-hybrid-linucb-pergroup-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 3, delegation-policy: bandit,
           base-config: campaigns/config_hybrid_linucb_pergroup.yml,
           arrival: poisson, arrival-rate: 3.0}
