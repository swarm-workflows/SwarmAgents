# E2: learned delegation quality (conference plan §4.2 E2, C1), on PBFT AND Snow (decided 2026-10-20).
#
#   python3.11 campaign.py campaigns/e2-hier90.yml --python python3.11 --dry-run
#   tmux new -s e2 'python3.11 campaign.py campaigns/e2-hier90.yml --python python3.11'
#
# Every cell: Hier-90, --groups-per-coordinator 3 (coordinators 88/89/90 each lead three groups),
# Poisson arrivals at 3 jobs/s (seeded by --seed, so every repeat and every arm sees the same times),
# and E2's injected failure profile (make_e2_profile.py: per coordinator one ram-weak, one cpu-weak
# and one mediocre group; oracle failure rate 5 %, best context-blind 30 %). Base configs are
# generated by campaigns/make_e2_configs.py into campaigns/e2/ — regenerate, never edit; each
# differs from config_{pbft,snow}_linucb_shared.yml only in the keys its header names.
# The pbft linucb-shared config is identical to the one oracle.py --validate passed on
# (docs/results/e2-prep, runs/pilot-e2val-c125ed8c).
#
# The load guard (mab.load_slack: 9) stays ON in every bandit arm (decided 2026-10-20). Each
# decision records the groups the guard left (`eligible`), and oracle.py splits regret into the
# guard's part and the policy's part (regret_guard_*, regret_policy_*). `linucb-noguard` is the
# guard-off ablation, one per engine. `random` has no bandit and so no guard.
#
# Cells per engine (5 repeats each):
#   E2   linucb-shared, linucb-pergroup, lints, eps, ucb1, random, linucb-noguard        7
#   E2a  failure flip at 420 s of each agent's failure clock (~300 s into arrivals):
#        LinUCB discount {1.0, 0.98}, eps-greedy step_size {null, 0.02}                   4
#        (eps-greedy has no discount; a recency step of 0.02 is its analogue of 0.98)
#   E2b  group 3 (agents 31-40: coordinator 89's cpu-weak group, the best group for its
#        ram_bound jobs, 64 % of the mix) SIGKILLed 120 s after distribution starts, held 180 s,
#        rejoined: {linucb-shared, linucb-nodecay, eps}                                   3
#        linucb-nodecay = timeout signal never fades (the decayed-timeout fix off). Liveness
#        gating has no off switch, so the plan's "fixes on/off" ablation is this one key.
#        Report regret_scored_share with every E2b regret.
#   E2c  work day (e2c_workday.json, stylized, NOT from a trace — say so; 8000 jobs) and
#        job-mix shift (jobs_mixshift_1800: ram_bound only until job 901) ×
#        {linucb-shared, linucb-pergroup, eps}                                            6
#   = 20 cells per engine, 40 cells, 200 runs. Sizing: a 1800-job Poisson-3 run took ~16 min
#   (rehearsals), so ~34 cells × 5 × ~17 min ≈ 48 h, plus the 6 work-day cells × 5 × ~40 min
#   ≈ 20 h: about 68 h. --only <cell> picks cells; cells run in file order (main arms first,
#   engines interleaved), so a partial campaign still has both engines.
#
# Run --validate (oracle.py) on run01 of the first cell of each engine before trusting the rest.
# Check reachability (90 of 92 needed) and regenerate agent_hosts.txt with
# make_agent_hosts.py --count 90 (interleaved) before starting.
out: runs/campaign-e2-c9c980b8
defaults:
  runner: run_test.py
  repeats: 5
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    inflight-drain-max-s: 1800
    agents: 90
    groups-per-coordinator: 3
    delegation-policy: bandit
    arrival: poisson
gate:
  redis:
    host: database
    port: 6379
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300
