llm:
  enabled: true
  provider: openai
  model: gpt-4o-mini
  base_url: ''
  temperature: 0.1
  timeout_seconds: 6
  use_for_selection: true
  disable_fallback: false
  cost_cache_ttl_s: 300.0
  cost_cache_max: 8192
  snow_cost_fallback: yield
  score_scale: 100
  tie_break_with_analytic: false
  tie_break_ref_cost: 11.85
  bid_pacing: none
  bid_pacing_target_s: 0.0
  bid_pacing_quantile: 0.5
  bid_pacing_min_samples: 8
  bid_pacing_bootstrap_s: 0.0
  bid_pacing_max_s: 30.0
  prompts:
    cost: 'You are a distributed scheduler in a mesh topology with peer agents.

      Score this job for THIS agent (higher = better fit, 0-{scale}).


      Key factors to consider:

      1. Resource headroom: Prefer agents with spare capacity

      2. Current load: Avoid overloaded agents (check peer context)

      3. DTN connectivity: Match job''s data_in/data_out to agent''s DTNs

      4. Load balancing: Favor underutilized agents in the mesh

      5. Execution time: Consider wall_time vs agent''s current queue depth


      When PEER CONTEXT is provided, use it to make load-aware decisions.

      Compare this agent''s load against peer loads to promote balanced distribution.


      Use the FULL range and avoid round numbers: two agents that differ at all should
      get

      different scores. A rating you would round to the nearest 5 is not discriminating.


      Return JSON: {{"score": <0-{scale}>, "explanation": "<concise reason>"}}

      Explanation should be max 1 sentence focusing on the key decision factor.'
