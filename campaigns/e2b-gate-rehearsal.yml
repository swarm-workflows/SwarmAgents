# Rehearsal for campaigns/e2b-hier90-58f3ab22.yml: one Snow LinUCB run (the arm that delegated to the
# dead group longest at c9c980b8). Pass: no delegation to group 3 later than ~67 s after the kill,
# re-adopted after the rejoin, 0 jobs twice.
out: runs/pilot-e2b-gate-58f3ab22
defaults:
  runner: run_test.py
  repeats: 1
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    inflight-drain-max-s: 1800
    agents: 90
    groups-per-coordinator: 3
    delegation-policy: bandit
    arrival: poisson
gate:
  redis:
    host: database
    port: 6379
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300
cells:
- name: e2b-hier90-snow-linucb-shared
  timeout_s: 7200
  args:
    jobs: 1800
    pegasus-jobs-dir: /root/workloads/jobs_1800
    runtime: 3600
    base-config: campaigns/e2/config_e2_snow_linucb-shared.yml
    arrival-rate: 3.0
  companion: python3.11 group_outage.py run --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
    --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
