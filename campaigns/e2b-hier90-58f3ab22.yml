# E2b re-run at 58f3ab22: the child-group liveness gate now closes at the failure detector's window
# (failure_threshold_seconds x 1.1 + 1 = 67 s) instead of at peer_expiry_seconds (300 s).
# At c9c980b8 the 180 s outage never reached 300 s, so coordinators delegated to the dead group until
# ~170 s into it (docs/results/e2-c9c980b8/README.md §3.4). Cells, arguments, configs and profile are
# copied unchanged from campaigns/e2-hier90.yml; only the code revision and the out dir differ.
#
#   tmux new -s e2b 'python3.11 campaign.py campaigns/e2b-hier90-58f3ab22.yml --python python3.11'
#
out: runs/campaign-e2b-58f3ab22
defaults:
  runner: run_test.py
  repeats: 5
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    inflight-drain-max-s: 1800
    agents: 90
    groups-per-coordinator: 3
    delegation-policy: bandit
    arrival: poisson
gate:
  redis:
    host: database
    port: 6379
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300
cells:
- name: e2b-hier90-pbft-linucb-shared
  timeout_s: 7200
  args:
    jobs: 1800
    pegasus-jobs-dir: /root/workloads/jobs_1800
    runtime: 3600
    base-config: campaigns/e2/config_e2_pbft_linucb-shared.yml
    arrival-rate: 3.0
  companion: python3.11 group_outage.py run --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
    --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
- name: e2b-hier90-snow-linucb-shared
  timeout_s: 7200
  args:
    jobs: 1800
    pegasus-jobs-dir: /root/workloads/jobs_1800
    runtime: 3600
    base-config: campaigns/e2/config_e2_snow_linucb-shared.yml
