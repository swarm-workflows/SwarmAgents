# E2b rehearsal 2, with the fixed group_outage.py (anchored process pattern, verified-kill-only rejoin).
out: runs/pilot-e2b-rehearsal2-c125ed8c
defaults:
  runner: run_test.py
  repeats: 1
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    inflight-drain-max-s: 1800
gate:
  redis:
    host: database
    port: 6379
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300
cells:
- name: e2b-rehearsal-hier90-pbft-linucb-shared-poisson3
  timeout_s: 7200
  args:
    agents: 90
    jobs: 1800
    pegasus-jobs-dir: /root/workloads/jobs_1800
    runtime: 3600
    groups-per-coordinator: 3
    delegation-policy: bandit
    base-config: campaigns/config_e2_pbft_linucb_shared.yml
    arrival: poisson
    arrival-rate: 3.0
  companion: python3.11 group_outage.py run --hosts-file agent_hosts.txt --agents
    90 --group 4 --duration 180 --delay 120 --start-after-log {run_dir}.log --run-dir
    {run_dir} --out {run_dir}/outage.json
