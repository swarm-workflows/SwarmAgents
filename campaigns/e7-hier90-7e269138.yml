# E7 at Hier-90 (conference plan §4.2 E7): the four external baselines beside the E0/E1′ Hier-90
# PBFT × analytic cells at c125ed8c, at both of that campaign's load levels, 5 repeats each.
# Rehearsed 30 Oct (campaigns/e7-rehearsal.yml, runs/pilot-e7-rehearsal): 4/4 ok, 1800/1800,
# 0 twice, arrivals.json planned times identical to the SWARM poisson3 cell's, 13.5-14.5 min/run.
#
# Every baseline runs on the SWARM cell's level-0 fleet, placed host-for-host as run_test.py places
# agents (agent_hosts.txt, interleaved, 90 hosts), with that cell's archived agent_profiles.json,
# its job set, its base config (wall-time clamp, executor_workers, cost weights) and its arrivals:
#   burst    — `--arrival batch`, 20 jobs per 1 s interval (the E0 / eScience saturation point)
#   poisson3 — Poisson 3 jobs/s, seed 42 (tests/test_baseline_arrivals.py)
# Sparrow's probes and claims go through Redis on `database` (state it beside the table).
# Not here: the Hier-270 scale point and the failure-injection arm.
#
#   tmux new -s e7 'python3.11 campaign.py campaigns/e7-hier90-7e269138.yml --python python3.11 2>&1 | tee /root/campaign-e7-7e269138.out'
out: runs/campaign-e7-7e269138

defaults:
  repeats: 5
  retries: 1
  timeout_s: 7200
  args:
    mode: remote
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    agents: 90
    jobs: 1800
    use-jobs-dir: /root/workloads/jobs_1800
    config: campaigns/config_pbft.yml
    timeout: 3600

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  # ---- burst: beside e0-hier90-pbft-analytic --------------------------------------------------
  - name: e7-hier90-greedy-burst
    runner: baselines/run_baseline_remote.py
    args: {scheduler: greedy, arrival: batch, jobs-per-interval: 20, interval: 1.0,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic/run01/agent_profiles.json}
  - name: e7-hier90-round-robin-burst
    runner: baselines/run_baseline_remote.py
    args: {scheduler: round-robin, arrival: batch, jobs-per-interval: 20, interval: 1.0,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic/run01/agent_profiles.json}
  - name: e7-hier90-random-burst
    runner: baselines/run_baseline_remote.py
    args: {scheduler: random, arrival: batch, jobs-per-interval: 20, interval: 1.0,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic/run01/agent_profiles.json}
  - name: e7-hier90-sparrow-burst
    runner: baselines/run_sparrow.py
    args: {seed: 42, arrival: batch, jobs-per-interval: 20, interval: 1.0,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic/run01/agent_profiles.json}
  # ---- poisson3: beside e0-hier90-pbft-analytic-poisson3 --------------------------------------
  - name: e7-hier90-greedy-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: greedy, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
  - name: e7-hier90-round-robin-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: round-robin, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
  - name: e7-hier90-random-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: random, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
  - name: e7-hier90-sparrow-poisson3
    runner: baselines/run_sparrow.py
    args: {seed: 42, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
