# E7 rehearsal (conference plan §4.2 E7): one run of each external baseline beside the E1′ Hier-90
# 3 jobs/s cell at c125ed8c (e0-hier90-pbft-analytic-poisson3). Every baseline runs on that cell's
# level-0 fleet, placed host-for-host as run_test.py places agents, with its archived
# agent_profiles.json, its job set, its base config (wall-time clamp, executor_workers, cost
# weights) and its arrival times (Poisson 3 jobs/s, seed 42; tests/test_baseline_arrivals.py).
# Pass: each run `ok`, drained, all 1800 jobs complete, 0 executed twice, metrics.json keyed by agent.
#
#   tmux new -s e7r 'python3.11 campaign.py campaigns/e7-rehearsal.yml --python python3.11'
out: runs/pilot-e7-rehearsal

defaults:
  repeats: 1
  retries: 0
  timeout_s: 7200
  args:
    mode: remote
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    agents: 90
    jobs: 1800
    use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json
    use-jobs-dir: /root/workloads/jobs_1800
    config: campaigns/config_pbft.yml
    arrival: poisson
    arrival-rate: 3.0
    arrival-seed: 42
    timeout: 3600

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: e7r-hier90-greedy-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: greedy}
  - name: e7r-hier90-round-robin-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: round-robin}
  - name: e7r-hier90-random-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: random}
  - name: e7r-hier90-sparrow-poisson3
    runner: baselines/run_sparrow.py
    args: {seed: 42}
