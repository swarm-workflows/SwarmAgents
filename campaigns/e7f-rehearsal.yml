# Rehearsal of E7 under failure on the slice (2026-11-12): one centralized (greedy) and one Sparrow
# run with the outage companion, before the 30 runs of
# frozen-0bceb349/{6-e7-hier90-failure-swarm,7-e7-hier90-failure-baselines}.yml. Pass criteria,
# read from each run: outage.json outcome ok (9 workers killed, held 180 s, 9 restarted UP);
# drain.json all_terminal with 1800/1800; scheduler stats workers_failed 9, jobs_requeued > 0,
# workers_readmitted 9; jobs_executed_twice 0.
out: runs/e7f-rehearsal

defaults:
  repeats: 1
  retries: 0
  timeout_s: 7200
  args:
    mode: remote
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    agents: 90
    jobs: 1800
    use-jobs-dir: /root/workloads/jobs_1800
    config: campaigns/config_pbft.yml
    timeout: 3600

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: e7f-rehearsal-greedy
    runner: baselines/run_baseline_remote.py
    args: {scheduler: greedy, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42,
           requeue-dead-workers: true,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
    companion: python3.11 group_outage.py run --target baseline --members 28,29,30,31,32,33,34,35,36
      --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
      --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
  - name: e7f-rehearsal-sparrow
    runner: baselines/run_sparrow.py
    args: {seed: 42, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
    companion: python3.11 group_outage.py run --target sparrow --members 28,29,30,31,32,33,34,35,36
      --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
      --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
