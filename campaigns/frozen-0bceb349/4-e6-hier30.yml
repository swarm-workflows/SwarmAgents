# FROZEN RE-RUN at isc27-freeze (0bceb349), conference plan §8 (re-derived 2026-11-09): E6 site partition at Hier-30, 2 cells x 3 = 6 runs.
# Copied unchanged from campaigns/e6-hier30-b9e51bbf.yml except `out:`; the cells, arguments, configs and workloads are the
# ones the earlier campaign ran, so the two are comparable cell for cell. Agent code fingerprint
# 6593ed84586e (104 files) verified identical on the db node and all 92 agents, 12 Nov 2026.
# Launched by /root/frozen.sh with the other files in this directory, in order.
#
# E6 re-run at b9e51bbf: the PBFT vote-on-adoption fix (leaf tier). Identical to e6-hier30-58f3ab22.yml
# except the code revision and the out dir (docs/results/e6-58f3ab22 is the before).
#
# E6 (conference plan §4.2 E6): safety under a site partition, Hier-30, PBFT and Snow, 3 repeats.
#
# agent<->agent traffic is cut between two site groups (partition.py, balanced by hosts, never
# splitting a site), BOTH directions, with Redis on `database` reachable from both sides throughout:
# the only partition the system can survive. Cut 60 s after job distribution starts, held 180 s,
# healed; partition.json records sides, timestamps, probe verdicts and held_s.
#
# NOTE 12 Nov 2026 (comments only, no run setting changed): two statements below are superseded.
# (a) PBFT: E6 at 58f3ab22/b9e51bbf measured 0 double finalizations; its quorum is a majority of
#     neighbor_map, which Redis keeps whole, so only each group's majority side decides
#     (ENGINEERING_NOTES 2026-10-30). (b) The mixed real-workflow E6 cell now exists:
#     5-e6-hier30-mixed.yml.
# Expected: Snow 0 double executions (the claim CAS is live on both sides — the safety statement);
# PBFT has no CAS, both sides can finalize, and since 2026-10-09 the second persist steps aside
# ("finalizes twice, executes once"): read jobs_executed_twice beside lost_leader_races. A PBFT
# double execution is the measurement, not a failure: campaign.py records it `ok_duplicated` and
# never retries it.
#
# Deviations from the plan, say so beside any number: the plan's E6 runs on the mixed real-workflow
# workload (needs T-6, not built); this uses the simulated 600-job replay set. Arrivals are Poisson
# 2 jobs/s (~300 s) rather than E0's burst, so jobs keep arriving through the whole cut (60-240 s);
# with the burst every job is offered within ~30 s and the cut would land after most decisions.
# Cell configs are E0's Hier-30 PBFT and E1′'s Snow base configs; code b9e51bbf.
#
#   tmux new -s e6 'python3.11 campaign.py campaigns/e6-hier30-b9e51bbf.yml --python python3.11'
out: runs/frozen-0bceb349/e6-hier30

defaults:
  runner: run_test.py
  repeats: 3
  retries: 1
  timeout_s: 5400
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    agents: 30
    jobs: 600
    topology: hierarchical
    groups-per-coordinator: 1
    hierarchical-level1-agent-type: resource
    pegasus-jobs-dir: /root/workloads/jobs_600
    runtime: 2400
    arrival: poisson
    arrival-rate: 2.0
    inflight-drain-max-s: 1800
  companion: >-
    python3.11 partition.py run --hosts-file agent_hosts.txt --sites-file agent_sites.txt
    --agents 30 --start-after-log {run_dir}.log --delay 60 --duration 180
    --out {run_dir}.partition.json

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: e6-hier30-pbft
    args: {base-config: campaigns/config_pbft.yml}
  - name: e6-hier30-snow
    args: {base-config: config_swarm_multi.yml}
