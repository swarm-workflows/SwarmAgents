# FROZEN RE-RUN at eval-freeze (0bceb349), added 17 Nov: one run to replace
# e7-hier90-failure-swarm/e7f-hier90-pbft-analytic-poisson3/run01, which killed the WRONG agents:
# its companion read configs/ before run_test.py regenerated it and took the previous cell's
# (Hier-30) group 3, 15 agents (16-20, 31-40), instead of Hier-90 G=1 group 3 (28-36). Every other
# E7-under-failure run killed 28-36. Members are now pinned, and group_outage.py reads the group
# after the run starts. After it runs, the bad run01 is moved aside and this one put in its place.
out: runs/frozen-0bceb349/e7f-pbft-run01-redo

defaults:
  runner: run_test.py
  repeats: 1
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    inflight-drain-max-s: 1800

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: e7f-hier90-pbft-analytic-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: campaigns/config_pbft.yml,
           arrival: poisson, arrival-rate: 3.0}
    companion: python3.11 group_outage.py run --members 28,29,30,31,32,33,34,35,36
      --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
      --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
