# FROZEN RE-RUN at isc27-freeze (0bceb349): E7 under failure, the baselines. 4 cells x 5 = 20
# runs, ~16 min each, beside 6-e7-hier90-failure-swarm.yml.
#
# The four E7 Hier-90 Poisson-3 baselines (campaigns/e7-hier90-7e269138.yml) with the same outage:
# workers 28,29,30,31,32,33,34,35,36 (the SWARM cell's level-0 group 3) are SIGKILLed 120 s after distribution
# starts, held 180 s, then restarted from their own launch commands (worker_launch.json) into the
# same run. --requeue-dead-workers (2026-11-12, baselines/common.py) makes each scheduler return a
# dead worker's READY/RUNNING jobs to PENDING once its heartbeat has been missing for SWARM's own
# detector window, runtime.failure_threshold_seconds x 1.1 + 1 = 67 s: what HTCondor does with a
# lost slot. Without it the run never drains. The no-failure E7 cells never pass it, so their
# code path is unchanged and their runs stand.
#
# Profiles: the c125ed8c cell's agent_profiles.json, as in the no-failure E7 file (the md5 is
# identical in every Hier-90 cell; --seed 42 --master-fleet-size 270).
out: runs/frozen-0bceb349/e7-hier90-failure-baselines

defaults:
  repeats: 5
  retries: 1
  timeout_s: 7200
  args:
    mode: remote
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    agents: 90
    jobs: 1800
    use-jobs-dir: /root/workloads/jobs_1800
    config: campaigns/config_pbft.yml
    timeout: 3600

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: e7f-hier90-greedy-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: greedy, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
    companion: python3.11 group_outage.py run --target baseline --members 28,29,30,31,32,33,34,35,36
      --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
      --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
  - name: e7f-hier90-round-robin-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: round-robin, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
    companion: python3.11 group_outage.py run --target baseline --members 28,29,30,31,32,33,34,35,36
      --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
      --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
  - name: e7f-hier90-random-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: random, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
    companion: python3.11 group_outage.py run --target baseline --members 28,29,30,31,32,33,34,35,36
      --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
      --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
  - name: e7f-hier90-sparrow-poisson3
    runner: baselines/run_sparrow.py
    args: {seed: 42, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
    companion: python3.11 group_outage.py run --target sparrow --members 28,29,30,31,32,33,34,35,36
      --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
      --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
