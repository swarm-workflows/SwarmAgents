# FROZEN RE-RUN at eval-freeze (0bceb349), added 17 Nov: E7c, the SCHEDULER goes down. SWARM side,
# 2 cells x 5 = 10 runs, ~16 min each, beside 9-e7c-hier90-scheduler-outage-baselines.yml.
#
# E7 under failure (files 6/7) killed workers; every scheduler recovered and the comparison said
# nothing about losing the component that schedules. Here one COORDINATOR is SIGKILLed 120 s after
# distribution starts, held 180 s, then restarted with the run's SWARM_RUN_ID (group_outage.py,
# the E2b path). At Hier-90 G=1 there are 9 coordinators (82-90), each the only parent of one
# level-0 group; agent 85 is group 3's parent (generated configs, --seed 42 --master-fleet-size
# 270), the group files 6/7 killed. Members are PINNED (--members 85).
# Agent code is unchanged (frozen); only the outage tool changed (17 Nov: late member read,
# sparrow-scheduler target).
#
# Same arrival and workload as the E7 Poisson cells: 1800 jobs, Poisson 3/s, seed 42.
out: runs/frozen-0bceb349/e7c-hier90-scheduler-outage-swarm

defaults:
  runner: run_test.py
  repeats: 5
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    inflight-drain-max-s: 1800

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: e7c-hier90-pbft-analytic-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: campaigns/config_pbft.yml,
           arrival: poisson, arrival-rate: 3.0}
    companion: python3.11 group_outage.py run --members 85 --hosts-file agent_hosts.txt --agents 90
      --group 3 --duration 180 --delay 120 --start-after-log {run_dir}.log --run-dir {run_dir}
      --out {run_dir}/outage.json
  - name: e7c-hier90-snow-analytic-poisson3
    timeout_s: 7200
    args: {agents: 90, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800, runtime: 3600,
           groups-per-coordinator: 1, base-config: config_swarm_multi.yml,
           arrival: poisson, arrival-rate: 3.0}
    companion: python3.11 group_outage.py run --members 85 --hosts-file agent_hosts.txt --agents 90
      --group 3 --duration 180 --delay 120 --start-after-log {run_dir}.log --run-dir {run_dir}
      --out {run_dir}/outage.json
