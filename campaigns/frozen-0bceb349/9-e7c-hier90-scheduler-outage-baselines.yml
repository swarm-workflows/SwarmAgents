# FROZEN RE-RUN at eval-freeze (0bceb349), added 17 Nov: E7c, the SCHEDULER goes down. Baselines,
# 4 cells x 5 = 20 runs, ~16 min each, beside 8-e7c-hier90-scheduler-outage-swarm.yml.
#
# Centralized (greedy, round-robin, random): the ONE scheduler goes down 120 s after distribution
# starts for 180 s (--scheduler-outage-at/-duration, baselines/scheduler.py `_scheduler_outage`).
# Emulated in the runner process, which also starts/stops the workers and writes results: nothing
# is placed, dispatched or polled while down; the distributor keeps submitting; workers keep running
# what they hold; on restart every in-memory structure is rebuilt from the store and every READY job
# is pushed again (a duplicate is refused by the worker's READY->RUNNING claim). It goes down between
# passes, so no assignment is half-written: the emulation favours the baseline.
#
# Sparrow: ONE of its 9 schedulers (index 3, on agent 31's host) is SIGKILLed and restarted from its
# launch record (group_outage.py --target sparrow-scheduler), the match for one of SWARM's 9
# coordinators. It owns a hash partition of the jobs; that partition is not probed while it is down.
#
# Same flags as the E7-under-failure baselines (file 7), including --requeue-dead-workers (no worker
# dies here, so it never fires), same profiles and jobs.
out: runs/frozen-0bceb349/e7c-hier90-scheduler-outage-baselines

defaults:
  repeats: 5
  retries: 1
  timeout_s: 7200
  args:
    mode: remote
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    agents: 90
    jobs: 1800
    use-jobs-dir: /root/workloads/jobs_1800
    config: campaigns/config_pbft.yml
    timeout: 3600

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: e7c-hier90-greedy-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: greedy, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           scheduler-outage-at: 120, scheduler-outage-duration: 180,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
  - name: e7c-hier90-round-robin-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: round-robin, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           scheduler-outage-at: 120, scheduler-outage-duration: 180,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
  - name: e7c-hier90-random-poisson3
    runner: baselines/run_baseline_remote.py
    args: {scheduler: random, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           scheduler-outage-at: 120, scheduler-outage-duration: 180,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
  - name: e7c-hier90-sparrow-poisson3
    runner: baselines/run_sparrow.py
    args: {seed: 42, arrival: poisson, arrival-rate: 3.0, arrival-seed: 42, requeue-dead-workers: true,
           use-profiles: runs/campaign-e0-e1-c125ed8c/e0-hier90-pbft-analytic-poisson3/run01/agent_profiles.json}
    companion: python3.11 group_outage.py run --target sparrow-scheduler --members 3
      --hosts-file agent_hosts.txt --agents 90 --group 3 --duration 180 --delay 120
      --start-after-log {run_dir}.log --run-dir {run_dir} --out {run_dir}/outage.json
