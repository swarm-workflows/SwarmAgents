# Pilot of the PBFT counter-proposal margin (consensus.pbft.counter_margin 0.05, 2026-11-05).
# Counter-proposals (2026-10-19) let a coordinator undercut a peer's proposal by any amount; at
# Hier-270 near-tie counters (2.9 %) split the 27-coordinator tier's binding COMMITs and stranded
# 4-12 jobs a run (runs/pilot-hier270-b9e51bbf). With counters off the tier ran clean.
#
#   p-hier270-pbft-margin05   — Hier-270 PBFT, counters on with the margin, pool 256/8192: must be
#                               clean (0 undecided, 0 twice) and close to the counters-off run.
#   p-hier90-pbft-margin05    — the E0 Hier-90 PBFT burst cell on the new code: the coordinator
#                               race counter-proposals fixed (one coordinator winning 55-73 %) must
#                               not return; compare per-coordinator wins with c125ed8c.
#
#   tmux new -s margin 'python3.11 campaign.py campaigns/pilot-counter-margin.yml --python python3.11 2>&1 | tee /root/pilot-counter-margin3.out'
# Relaunched 2026-11-05 18:0x into a fresh directory: the first launch (runs/pilot-counter-margin)
# ran an engine where a coordinator kept the margin from countering but still adopted a proposal
# heard via PREPARE without voting, so a lost PROPOSAL stalled near-tied tiers (stop review).
# It was interrupted after 8 minutes and is not a result.
# runs/pilot-counter-margin2 (18:01) ran the margin + adoption fix: attempt 1 stranded job 2646,
# attempt 2 had 6 undecided and was stopped. Cause found 2026-11-05: the periodic scan read only
# PENDING/READY/RUNNING/COMPLETE, so a coordinator-tier record left mid-election (PRE_PREPARE/
# PREPARE/COMMIT) for two scans was purged as withdrawn by every coordinator (SCAN_STATES).
# Relaunched on the fixed scan:
out: runs/pilot-counter-margin3

defaults:
  runner: run_test.py
  repeats: 1
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    groups-per-coordinator: 1
    inflight-drain-max-s: 1800

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: p-hier270-pbft-margin05
    timeout_s: 10800
    args: {agents: 270, agents-per-host: 3, jobs: 5400, pegasus-jobs-dir: /root/workloads/jobs_5400,
           runtime: 5400, base-config: campaigns/config_pbft_h270.yml}
  - name: p-hier90-pbft-margin05
    timeout_s: 7200
    args: {agents: 90, agents-per-host: 1, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800,
           runtime: 3600, base-config: campaigns/config_pbft.yml}
  # Added 2026-11-05: the same E0 Hier-90 burst cell with counter-proposals off, on the current
  # code. If no coordinator dominates, counter_propose: false can be every PBFT cell's setting.
  - name: p-hier90-pbft-nocounter
    timeout_s: 7200
    args: {agents: 90, agents-per-host: 1, jobs: 1800, pegasus-jobs-dir: /root/workloads/jobs_1800,
           runtime: 3600, base-config: campaigns/config_pbft_nocounter.yml}
