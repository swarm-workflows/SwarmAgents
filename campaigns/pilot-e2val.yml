# E2 failure-profile validation run: oracle --validate on one PBFT LinUCB G=3 run.
out: runs/pilot-e2val-c125ed8c
defaults:
  runner: run_test.py
  repeats: 1
  retries: 1
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    agents-per-host: 1
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    topology: hierarchical
    hierarchical-level1-agent-type: resource
    inflight-drain-max-s: 1800
gate:
  redis:
    host: database
    port: 6379
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300
cells:
- name: e2val-hier90-pbft-linucb-shared-poisson3
  timeout_s: 7200
  args:
    agents: 90
    jobs: 1800
    pegasus-jobs-dir: /root/workloads/jobs_1800
    runtime: 3600
    groups-per-coordinator: 3
    delegation-policy: bandit
    base-config: campaigns/config_e2_pbft_linucb_shared.yml
    arrival: poisson
    arrival-rate: 3.0
