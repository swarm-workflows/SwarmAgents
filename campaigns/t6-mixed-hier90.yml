# E1' mixed rung (T-6, plan §10): the Hier-90 analytic cells with the real workflows merged into
# the simulated set — 1800 simulated + 22 cper-soilmoisture + 30 eht-m87 + 35 tnseq real jobs
# (/export/swarm-wf/mixed_1800_wf, merge_workflow_jobs.py; simulated jobs' file names renamed,
# nothing else). PBFT and Snow, 3 repeats, burst arrivals as E0. Real jobs arrive after the
# simulated ones (job_1801..1887; tnseq is job_1853..1887, merged 11 Nov 2026). Real rows are split out in every figure; their wall time is
# uncapped. Run only after the §10 standalone pilots (campaigns/t6-wfpilot.yml, t6-tnpilot.yml) pass.
# The 1852-job set without tnseq is kept as /export/swarm-wf/mixed_1800_wf.pre-tnseq.
#
#   tmux new -s mixed 'python3.11 campaign.py campaigns/t6-mixed-hier90.yml --python python3.11 2>&1 | tee /root/campaign-t6-mixed.out'
out: runs/campaign-t6-mixed-hier90
defaults:
  runner: run_test.py
  retries: 1
  timeout_s: 9000
  args:
    mode: remote
    agent-type: resource
    db-host: database
    agent-hosts-file: agent_hosts.txt
    master-fleet-size: 270
    seed: 42
    rtt-samples: 20
    all-dtns: true
    hierarchical-level1-agent-type: resource
    inflight-drain-max-s: 1800
    runtime: 3600

gate:
  redis: {host: database, port: 6379}
  clock_check: ./fix_slice_clocks.sh --check
  retries: 3
  wait_s: 300

cells:
  - name: e1-hier90-pbft-mixed
    repeats: 3
    args: {topology: hierarchical, agents: 90, agents-per-host: 1, jobs: 1887, groups-per-coordinator: 1,
           pegasus-jobs-dir: /export/swarm-wf/mixed_1800_wf, base-config: campaigns/config_mixed_pbft.yml}
  - name: e1-hier90-snow-mixed
    repeats: 3
    args: {topology: hierarchical, agents: 90, agents-per-host: 1, jobs: 1887, groups-per-coordinator: 1,
           pegasus-jobs-dir: /export/swarm-wf/mixed_1800_wf, base-config: campaigns/config_mixed_snow.yml}
