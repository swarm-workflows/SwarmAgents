  core: 8
  gpu: 8
  ram: 32
  disk: 100
  bw: 0
  burst_size: 0
  unit: 0
  mtu: 0
topology:
  children: null
  level: 0
  group: 0
  group_size: 0
  group_count: 0
  parent: null
  peer_agents:
    - 1
    - 2
  type: mesh
grpc:
  port: 20000 
  host: "0.0.0.0"
dtns:
  - name: dtn1
    ip: "192.168.1.10"
    user: "dtn_user"
    connectivity_score: 0.95
  - name: dtn2
    ip: "192.168.1.11"
    user: "dtn_user2"
